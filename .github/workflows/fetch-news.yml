name: 매일 뉴스 자동 수집 및 배포

on:
  schedule:
    # GitHub 예약 지연에 대비해 오전 6시 전후로 3회 확인합니다.
    # 먼저 성공한 실행만 뉴스 API를 사용하고, 나머지는 시세만 갱신합니다.
    - cron: '53 20 * * *' # 05:53 KST
    - cron: '13 21 * * *' # 06:13 KST
    - cron: '33 21 * * *' # 06:33 KST
    # 평일 하루 종일 매시 00·15·30·45분에 국내외 지연 시세 갱신
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '수집할 날짜 (YYYY-MM-DD, 비워두면 오늘 KST)'
        required: false
        default: ''
      market_only:
        description: '뉴스 요약 없이 시세만 빠르게 업데이트'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-news-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: API 키 확인
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY"

      - name: 실행 모드 결정
        id: mode
        env:
          REQUESTED_MARKET_ONLY: ${{ inputs.market_only }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "market_only=${REQUESTED_MARKET_ONLY:-false}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "53 20 * * *" ] || [ "$SCHEDULE" = "13 21 * * *" ] || [ "$SCHEDULE" = "33 21 * * *" ]; then
            TODAY_PATH="data/news/$(TZ=Asia/Seoul date +'%Y/%m/%d').json"
            if [ -s "$TODAY_PATH" ] && jq -e 'type == "array" and length > 0' "$TODAY_PATH" >/dev/null 2>&1; then
              echo "market_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "market_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "market_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 뉴스 수집 및 요약
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_DATE: ${{ inputs.date }}
          MARKET_ONLY: ${{ steps.mode.outputs.market_only }}
        run: python scripts/fetch_news.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news data/market.json data/stocks.json
          git diff --staged --quiet || git commit -m "뉴스 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: Pages 파일 준비
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/

      - name: Pages 파일 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
