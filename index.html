<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 뉴스 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0e1117;
  --bg2:       #161b25;
  --bg3:       #1c2333;
  --bg4:       #222b3a;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --text1:     #e8ecf1;
  --text2:     #8b9ab0;
  --text3:     #5a6a80;
  --accent:    #3b82f6;
  --accent-bg: rgba(59,130,246,0.12);
  --accent-bd: rgba(59,130,246,0.35);
  --up:        #34d399;
  --down:      #f87171;
  --up-bg:     rgba(52,211,153,0.1);
  --down-bg:   rgba(248,113,113,0.1);
  --gold:      #f59e0b;
  --gold-bg:   rgba(245,158,11,0.12);
  --radius-sm: 5px;
  --radius:    8px;
  --radius-lg: 12px;
  --sidebar-w: 210px;
  --detail-w:  230px;
  --font: 'Noto Sans KR', 'Inter', sans-serif;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text1); font-family: var(--font); font-size: 13px; line-height: 1.5; }

/* ─── Layout Shell ─── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ─── Top Bar ─── */
#topbar {
  display: flex; flex-direction: column;
  height: 78px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 10;
}
.topbar-main { height: 46px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 15px; font-weight: 600; color: var(--text1); letter-spacing: -0.3px; }
.logo span { color: var(--accent); }
.market-pills { display: flex; gap: 6px; padding: 4px 16px 6px; overflow-x: auto; border-top: 1px solid var(--border); scrollbar-width: thin; }
.mpill {
  background: var(--bg3); cursor: pointer; font-family: var(--font); white-space: nowrap;
  font-size: 11px; padding: 3px 8px; border-radius: 20px;
  border: 1px solid var(--border2); color: var(--text2);
  display: flex; align-items: center; gap: 4px;
}
.mpill:hover, .mpill:focus-visible { border-color: var(--accent-bd); outline: none; }
.mpill .val { font-weight: 600; }
.mpill.up .val { color: var(--up); }
.mpill.dn .val { color: var(--down); }

.topbar-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: none; cursor: pointer;
  color: var(--text2); display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--bg3); color: var(--text1); }
.icon-btn.active { background: var(--accent-bg); border-color: var(--accent-bd); color: var(--accent); }

/* ─── Body ─── */
#body { display: flex; flex: 1; overflow: hidden; }

/* ─── Sidebar ─── */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

.sb-section { padding: 14px 12px; border-bottom: 1px solid var(--border); }
.sb-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.6px; margin-bottom: 8px; text-transform: uppercase; }

/* Calendar */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-nav-title { font-size: 12px; font-weight: 600; color: var(--text1); }
.cal-nav-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 2px 5px; border-radius: 3px; }
.cal-nav-btn:hover { color: var(--text1); background: var(--bg3); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.cal-dh { text-align: center; font-size: 9px; color: var(--text3); padding: 2px 0 4px; font-weight: 500; }
.cal-d {
  text-align: center; font-size: 11px; padding: 4px 2px;
  border-radius: 4px; cursor: pointer; color: var(--text3);
  transition: background 0.1s;
}
.cal-d:hover { background: var(--bg3); color: var(--text1); }
.cal-d.has { color: var(--text2); }
.cal-d.sel { background: var(--accent); color: #fff; font-weight: 600; }
.cal-d.today { color: var(--accent); }
.cal-d.empty { cursor: default; }

/* Week list */
.week-list { display: flex; flex-direction: column; gap: 2px; }
.week-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 7px; border-radius: var(--radius-sm);
  cursor: pointer; color: var(--text2); font-size: 11px;
  transition: background 0.1s;
}
.week-item:hover { background: var(--bg3); color: var(--text1); }
.week-item.active { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-bd); }
.week-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
.week-item.active .week-dot { background: var(--accent); }

/* Watchlist sidebar */
.watch-list { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.watch-item {
  display: flex; align-items: center; justify-content: space-between;
  border-radius: var(--radius-sm);
  transition: background 0.1s;
}
.watch-item:hover { background: var(--bg3); }
.watch-open { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; padding: 5px 4px 5px 7px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; font-family: var(--font); }
.watch-remove { width: 28px; height: 28px; border: 0; border-radius: 4px; background: none; color: var(--text3); cursor: pointer; font-size: 14px; }
.watch-remove:hover, .watch-remove:focus-visible { color: var(--down); background: var(--down-bg); outline: none; }
.watch-item-name { font-size: 12px; font-weight: 500; color: var(--text1); }
.watch-item-code { font-size: 10px; color: var(--text3); }
.watch-item-chg { font-size: 11px; font-weight: 600; }
.watch-item-chg.up { color: var(--up); }
.watch-item-chg.dn { color: var(--down); }

.add-watch-btn {
  width: 100%; margin-top: 8px; padding: 6px;
  background: none; border: 1px dashed var(--border2);
  border-radius: var(--radius-sm); color: var(--text3);
  cursor: pointer; font-size: 11px; font-family: var(--font);
  transition: border-color 0.15s, color 0.15s;
}
.add-watch-btn:hover { border-color: var(--accent-bd); color: var(--accent); }

/* Search in sidebar */
.sb-search {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 8px;
}
.sb-search input {
  background: none; border: none; outline: none;
  font-size: 12px; color: var(--text1); width: 100%; font-family: var(--font);
}
.sb-search input::placeholder { color: var(--text3); }
.sb-search-icon { color: var(--text3); font-size: 13px; }

/* ─── Main ─── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#main-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.main-title { font-size: 13px; font-weight: 600; color: var(--text1); }
.main-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

.filter-tabs { display: flex; gap: 3px; }
.ftab {
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 500; cursor: pointer;
  color: var(--text3); border: 1px solid transparent;
  transition: all 0.1s; background: none; font-family: var(--font);
}
.ftab:hover { color: var(--text1); background: var(--bg3); }
.ftab.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-bd); }

#news-list {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
}

/* News Card */
.news-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.news-card:hover { border-color: var(--border2); background: var(--bg3); }
.news-card.active { border-color: var(--accent-bd); background: var(--bg3); }

.nc-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.nc-source { font-size: 10px; color: var(--text3); background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; }
.nc-badge { font-size: 10px; padding: 1px 7px; border-radius: 20px; font-weight: 500; }
.badge-kr { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-bd); }
.badge-us { background: var(--up-bg); color: var(--up); border: 1px solid rgba(52,211,153,0.3); }
.nc-time { font-size: 10px; color: var(--text3); margin-left: auto; }

.nc-title { font-size: 13px; font-weight: 600; line-height: 1.45; margin-bottom: 6px; color: var(--text1); }
.nc-summary { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 10px; }

.nc-stocks { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.nc-stocks-label { font-size: 10px; color: var(--text3); margin-right: 2px; }
.stock-chip {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 500;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 4px; padding: 2px 7px; cursor: pointer;
  transition: border-color 0.1s;
}
.stock-chip:hover { border-color: var(--accent-bd); }
.stock-chip .chg { font-size: 10px; font-weight: 600; }
.chg.up { color: var(--up); }
.chg.dn { color: var(--down); }

.star-btn {
  margin-left: auto; background: none; border: none; cursor: pointer;
  font-size: 14px; color: var(--text3); padding: 2px 4px;
  transition: color 0.15s;
}
.star-btn:hover { color: var(--gold); }
.star-btn.starred { color: var(--gold); }

/* Empty state */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--text3);
}
.empty-state .es-icon { font-size: 32px; opacity: 0.4; }
.empty-state .es-title { font-size: 14px; font-weight: 500; color: var(--text2); }
.empty-state .es-sub { font-size: 12px; }

/* ─── Detail Panel ─── */
#detail {
  width: var(--detail-w); min-width: var(--detail-w);
  border-left: 1px solid var(--border);
  background: var(--bg2); display: flex; flex-direction: column;
  overflow: hidden;
}
#detail-placeholder {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  color: var(--text3);
}
.mobile-detail-close { display: none; }
#detail-content { flex: 1; overflow-y: auto; display: none; flex-direction: column; }

.dp-header { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.dp-company { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.dp-icon {
  width: 32px; height: 32px; border-radius: 7px;
  background: var(--accent-bg); border: 1px solid var(--accent-bd);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--accent); flex-shrink: 0;
}
.dp-name { font-size: 14px; font-weight: 600; color: var(--text1); }
.dp-code { font-size: 10px; color: var(--text3); }
.dp-price { font-size: 22px; font-weight: 600; color: var(--text1); line-height: 1.2; margin-bottom: 3px; }
.dp-price span { font-size: 12px; font-weight: 400; color: var(--text3); }
.dp-chg { font-size: 12px; font-weight: 600; }
.dp-chg.up { color: var(--up); }
.dp-chg.dn { color: var(--down); }

.dp-watch-btn {
  width: 100%; margin-top: 8px; padding: 6px 10px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); color: var(--text2);
  cursor: pointer; font-size: 11px; font-weight: 500; font-family: var(--font);
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all 0.15s;
}
.dp-watch-btn:hover { border-color: var(--gold); color: var(--gold); }
.dp-watch-btn.starred { background: var(--gold-bg); border-color: rgba(245,158,11,0.4); color: var(--gold); }

/* Chart tabs */
.chart-tabs { display: flex; gap: 4px; padding: 10px 14px 6px; }
.ctab {
  font-size: 10px; font-weight: 600; padding: 3px 9px;
  border-radius: 4px; cursor: pointer; border: 1px solid var(--border);
  color: var(--text3); background: none; font-family: var(--font);
  transition: all 0.1s;
}
.ctab:hover { color: var(--text1); }
.ctab.active { background: var(--bg3); border-color: var(--border2); color: var(--text1); }

.chart-wrap {
  margin: 0 14px 4px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; height: 90px;
  position: relative;
}
.chart-wrap svg { display:block; width:100%; height:90px; overflow:visible; }
.chart-wrap.external { height: 135px; background: #fff; }
.chart-wrap iframe { display:block; width:100%; height:100%; border:0; }
.chart-wrap img { display:block; width:100%; height:100%; object-fit:contain; }

.dp-section { padding: 10px 14px 0; }
.dp-section-title { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
.dp-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); }
.dp-row:last-child { border-bottom: none; }
.dp-row .lbl { font-size: 11px; color: var(--text2); }
.dp-row .val { font-size: 11px; font-weight: 600; color: var(--text1); }
.dp-row .val.up { color: var(--up); }
.dp-row .val.dn { color: var(--down); }
.dp-row .val.accent { color: var(--accent); }

.rel-news { padding: 10px 14px 14px; }
.rel-news-item {
  padding: 7px 0; border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.rel-news-item:last-child { border-bottom: none; }
.rel-news-title { font-size: 11px; color: var(--text1); line-height: 1.4; margin-bottom: 2px; }
.rel-news-date { font-size: 10px; color: var(--text3); }

/* ─── Watchlist Modal ─── */
#watchlist-modal {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
#watchlist-modal.open { display: flex; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); width: 400px; max-height: 520px;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 14px; font-weight: 600; }
.modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; padding: 0 4px; }
.modal-close:hover { color: var(--text1); }
.modal-search { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.modal-search-inner {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); padding: 8px 10px;
}
.modal-search-inner input {
  background: none; border: none; outline: none; flex: 1;
  font-size: 13px; color: var(--text1); font-family: var(--font);
}
.modal-search-inner input::placeholder { color: var(--text3); }
.search-clear { display: none; width: 24px; height: 24px; border: 0; border-radius: 4px; background: none; color: var(--text3); cursor: pointer; }
.search-clear.visible { display: block; }
.search-clear:hover, .search-clear:focus-visible { color: var(--text1); background: var(--bg4); outline: none; }
.search-status { padding: 7px 16px; color: var(--text3); font-size: 10px; border-bottom: 1px solid var(--border); }
.search-results { flex: 1; overflow-y: auto; }
.search-result-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: background 0.1s;
}
.search-result-item:hover { background: var(--bg3); }
.sri-info { display: flex; flex-direction: column; gap: 2px; }
.sri-name { font-size: 13px; font-weight: 500; }
.sri-code { font-size: 10px; color: var(--text3); }
.add-btn {
  padding: 4px 10px; background: var(--accent-bg); border: 1px solid var(--accent-bd);
  border-radius: var(--radius-sm); color: var(--accent); font-size: 11px;
  font-weight: 600; cursor: pointer; font-family: var(--font);
  transition: all 0.1s;
}
.add-btn:hover { background: var(--accent); color: #fff; }
.add-btn.added { background: var(--up-bg); border-color: rgba(52,211,153,0.3); color: var(--up); cursor: default; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 760px) {
  .logo { font-size: 14px; }
  #topbar { height: 78px; }
  .market-pills { padding-inline: 10px; }
  #body { display: block; overflow: hidden; }
  #sidebar { display: none; }
  #main { width: 100%; height: 100%; }
  #main-header { align-items: flex-start; gap: 8px; flex-direction: column; }
  .filter-tabs { overflow-x: auto; max-width: 100%; }
  #detail {
    position: fixed; inset: 78px 0 0; z-index: 30;
    width: 100%; min-width: 0; border-left: 0;
    transform: translateX(100%); visibility: hidden;
    transition: transform .18s ease, visibility 0s linear .18s;
  }
  #detail.mobile-open {
    transform: translateX(0); visibility: visible;
    transition: transform .18s ease;
  }
  .mobile-detail-close {
    display: block; flex-shrink: 0; width: 100%; padding: 10px 14px;
    border: 0; border-bottom: 1px solid var(--border); background: var(--bg2);
    color: var(--accent); text-align: left; font: 600 12px var(--font); cursor: pointer;
  }
  .news-card { padding: 13px 14px; }
  .nc-summary { line-height: 1.55; }
}
</style>
</head>
<body>

<div id="app">

  <!-- Top Bar -->
  <div id="topbar">
    <div class="topbar-main">
      <div class="topbar-left">
        <div class="logo">Stock<span>Lens</span></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="관심종목 관리" aria-label="관심종목 관리" onclick="openWatchlistModal()">★</button>
        <button class="icon-btn" title="새로고침" aria-label="뉴스와 시세 새로고침" onclick="init()">↻</button>
      </div>
    </div>
    <div class="market-pills" id="market-pills" aria-label="국내외 주요 지수">
      <div class="mpill"><span>주요 지수 불러오는 중...</span></div>
    </div>
  </div>

  <!-- Body -->
  <div id="body">

    <!-- Sidebar -->
    <div id="sidebar">

      <!-- Calendar -->
      <div class="sb-section" style="padding-bottom:10px;">
        <div class="sb-label">날짜 선택</div>
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="prevMonth()">‹</button>
          <div class="cal-nav-title" id="cal-month-title"></div>
          <button class="cal-nav-btn" onclick="nextMonth()">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- Week -->
      <div class="sb-section">
        <div class="sb-label">주차</div>
        <div class="week-list" id="week-list"></div>
      </div>

      <!-- Watchlist -->
      <div class="sb-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
        <div class="sb-label">관심종목</div>
        <div class="watch-list" id="watchlist-sidebar"></div>
        <button class="add-watch-btn" onclick="openWatchlistModal()">+ 종목 추가</button>
      </div>

    </div>

    <!-- Main News -->
    <div id="main">
      <div id="main-header">
        <div>
          <div class="main-title" id="main-title">2026년 10월 20일 뉴스</div>
          <div class="main-sub" id="main-sub">뉴스 로딩 중...</div>
        </div>
        <div class="filter-tabs">
          <button class="ftab active" onclick="setFilter('all',this)">전체</button>
          <button class="ftab" onclick="setFilter('kr',this)">국내</button>
          <button class="ftab" onclick="setFilter('us',this)">해외</button>
          <button class="ftab" onclick="setFilter('watch',this)">관심종목</button>
        </div>
      </div>
      <div id="news-list"></div>
    </div>

    <!-- Detail Panel -->
    <div id="detail">
      <div id="detail-placeholder" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text3);">
        <div style="font-size:28px;opacity:0.3;">📈</div>
        <div style="font-size:12px;font-weight:500;color:var(--text2);">종목을 선택하세요</div>
        <div style="font-size:11px;">뉴스 카드의 종목 칩을 클릭하면<br>상세 정보가 표시됩니다.</div>
      </div>
      <div id="detail-content"></div>
    </div>

  </div>
</div>

<!-- Watchlist Modal -->
<div id="watchlist-modal" role="dialog" aria-modal="true" aria-labelledby="watchlist-modal-title">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="watchlist-modal-title">관심종목 관리</div>
      <button class="modal-close" aria-label="관심종목 관리 닫기" onclick="closeWatchlistModal()">✕</button>
    </div>
    <div class="modal-search">
      <div class="modal-search-inner">
        <span style="color:var(--text3);font-size:14px;">🔍</span>
        <input id="modal-search-input" aria-label="종목명 또는 종목코드 검색" placeholder="코스피·코스닥 종목명 또는 코드" oninput="searchStocks(this.value)">
        <button class="search-clear" id="search-clear" aria-label="검색어 지우기" onclick="clearStockSearch()">✕</button>
      </div>
    </div>
    <div class="search-status" id="search-status" aria-live="polite"></div>
    <div class="search-results" id="modal-results"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
const STATE = {
  year: 2026,
  month: 9,        // 0-indexed (9 = October)
  selectedDate: null,
  selectedWeek: null,
  filter: 'all',
  watchlist: JSON.parse(localStorage.getItem('watchlist') || '[]'),
  activeStock: null,
  allNews: [],
  newsIndex: {},   // { "YYYY/MM/DD": true }
  marketUpdatedAt: null
};

/* ═══════════════════════════════════════
   DATA LOADING — data/news/ JSON 파일에서 읽기
═══════════════════════════════════════ */
const NEWS_CACHE = {};   // { "YYYY/MM/DD": [...] }
let NEWS_INDEX   = {};   // { "YYYY/MM/DD": count }
let STOCK_DETAIL_DB = {};
let STOCK_SEARCH_DB = [];

const MARKET_INDEX_CODES = ['KOSPI','KOSDAQ','KOSPI200','SP500','NASDAQ','DOW','NIKKEI','HANGSENG','SHANGHAI'];

async function fetchMarketData() {
  try {
    const r = await fetch('data/market.json?v=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    STOCK_DETAIL_DB = data.stocks || {};
    STATE.marketUpdatedAt = data.updatedAt || null;
    renderMarketIndices();
  } catch (e) {
    console.warn('실제 시세 데이터 로드 실패:', e);
    STOCK_DETAIL_DB = {};
    renderMarketIndices();
  }
}

async function fetchStockUniverse() {
  try {
    const r = await fetch('data/stocks.json?v=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const merged = [...(data.stocks || []), ...FALLBACK_STOCKS];
    STOCK_SEARCH_DB = [...new Map(merged.map(stock => [stock.code, stock])).values()];
  } catch (e) {
    console.warn('전체 상장종목 목록 로드 실패:', e);
    STOCK_SEARCH_DB = [...FALLBACK_STOCKS];
  }
}

function renderMarketIndices() {
  const el = document.getElementById('market-pills');
  const available = MARKET_INDEX_CODES.filter(code => STOCK_DETAIL_DB[code]);
  if (!available.length) {
    el.innerHTML = '<div class="mpill"><span>주요 지수를 불러올 수 없습니다</span></div>';
    return;
  }
  el.innerHTML = available.map(code => {
    const d = STOCK_DETAIL_DB[code];
    const direction = d.chg >= 0 ? 'up' : 'dn';
    const arrow = d.chg >= 0 ? '▲' : '▼';
    const value = Number(d.price).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    return `<button class="mpill ${direction}" onclick="showStockDetail('${code}')" aria-label="${d.name} ${value}, ${arrow} ${Math.abs(d.chg)}퍼센트">
      <span>${d.name}</span><span class="val">${value} ${arrow}${Math.abs(d.chg)}%</span>
    </button>`;
  }).join('');
}

async function fetchNewsIndex() {
  try {
    const r = await fetch('data/news/index.json?v=' + Date.now());
    NEWS_INDEX = await r.json();
    // 달력에 점 표시 갱신
    renderCalendar();
  } catch(e) {
    console.warn('index.json 로드 실패:', e);
  }
}

async function fetchNewsForDate(dateStr) {
  // dateStr: "YYYY/MM/DD"
  if (NEWS_CACHE[dateStr]) return NEWS_CACHE[dateStr];
  try {
    const r = await fetch(`data/news/${dateStr}.json?v=` + Date.now());
    if (!r.ok) return [];
    const items = await r.json();
    // id 필드가 없으면 인덱스로 부여
    items.forEach((n, i) => { if (!n.id) n.id = i + 1; n.date = dateStr; });
    NEWS_CACHE[dateStr] = items;
    return items;
  } catch(e) {
    return [];
  }
}

function hasNews(dateStr) {
  return !!NEWS_INDEX[dateStr];
}

/* 상세 조회 지원 종목 */
const FALLBACK_STOCKS = [
  { code: '005930', name: '삼성전자', market: 'KOSPI' },
  { code: '000660', name: 'SK하이닉스', market: 'KOSPI' },
  { code: '006800', name: '미래에셋증권', market: 'KOSPI' },
  { code: '035720', name: '카카오', market: 'KOSPI' },
  { code: '005380', name: '현대차', market: 'KOSPI' },
  { code: '373220', name: 'LG에너지솔루션', market: 'KOSPI' },
  { code: '006400', name: '삼성SDI', market: 'KOSPI' },
  { code: '035420', name: 'NAVER', market: 'KOSPI' },
  { code: '051910', name: 'LG화학', market: 'KOSPI' },
  { code: 'AAPL', name: 'Apple', market: 'NASDAQ' },
  { code: 'NVDA', name: 'NVIDIA', market: 'NASDAQ' },
  { code: 'MSFT', name: 'Microsoft', market: 'NASDAQ' },
  { code: 'META', name: 'Meta', market: 'NASDAQ' },
  { code: 'GOOGL', name: 'Alphabet', market: 'NASDAQ' },
  { code: 'AMZN', name: 'Amazon', market: 'NASDAQ' },
  { code: 'TSLA', name: 'Tesla', market: 'NASDAQ' },
];

const STOCK_CODE_BY_NAME = {
  '삼성전자': '005930', '삼전': '005930',
  'SK하이닉스': '000660', '하이닉스': '000660',
  '미래에셋증권': '006800', '미래에셋': '006800',
  '현대로템': '064350', '한국전력': '015760',
  '한화에어로스페이스': '012450', '대양전기공업': '108380',
  '엘리스그룹': 'A0158S0', '엘리스': 'A0158S0',
  '코스피': 'KOSPI'
};

function normalizeStock(stock) {
  if (!stock) return stock;
  const matchedName = Object.keys(STOCK_CODE_BY_NAME).find(name => stock.name && stock.name.includes(name));
  const code = matchedName ? STOCK_CODE_BY_NAME[matchedName] : stock.code;
  const canonical = STOCK_SEARCH_DB.find(item => item.code === code);
  const detail = STOCK_DETAIL_DB[code];
  if (canonical) return { ...stock, code, name: canonical.name, market: canonical.market };
  if (detail) return { ...stock, code, name: detail.name || stock.name, market: detail.market || stock.market };
  return { ...stock, code };
}

function getStock(code) {
  const listed = STOCK_SEARCH_DB.find(stock => stock.code === code);
  const detail = STOCK_DETAIL_DB[code];
  return listed || (detail ? { code, name: detail.name || code, market: detail.market || '' } : null);
}

function normalizeCode(code) {
  if (STOCK_DETAIL_DB[code]) return code;
  return STOCK_CODE_BY_NAME[code] || code;
}

/* ═══════════════════════════════════════
   CALENDAR
═══════════════════════════════════════ */
function renderCalendar() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-month-title').textContent = `${STATE.year}년 ${months[STATE.month]}`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const days = ['일','월','화','수','목','금','토'];
  days.forEach(d => { const el = document.createElement('div'); el.className = 'cal-dh'; el.textContent = d; grid.appendChild(el); });

  const firstDay = new Date(STATE.year, STATE.month, 1).getDay();
  const daysInMonth = new Date(STATE.year, STATE.month + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div'); el.className = 'cal-d empty'; grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    const dateStr = `${STATE.year}/${String(STATE.month+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear()===STATE.year && today.getMonth()===STATE.month && today.getDate()===d;
    const isSel = STATE.selectedDate === dateStr;
    const hasNews = !!NEWS_INDEX[dateStr];
    el.className = 'cal-d' + (hasNews ? ' has' : '') + (isToday ? ' today' : '') + (isSel ? ' sel' : '');
    el.textContent = d;
    el.onclick = () => selectDate(dateStr);
    grid.appendChild(el);
  }
}

function selectDate(dateStr) {
  STATE.selectedDate = dateStr;
  STATE.selectedWeek = null;
  renderCalendar();
  renderWeeks();
  loadNews();
}

function prevMonth() { STATE.month--; if (STATE.month < 0) { STATE.month = 11; STATE.year--; } renderCalendar(); renderWeeks(); }
function nextMonth() { STATE.month++; if (STATE.month > 11) { STATE.month = 0; STATE.year++; } renderCalendar(); renderWeeks(); }

/* ═══════════════════════════════════════
   WEEKS
═══════════════════════════════════════ */
function getWeeksOfMonth(year, month) {
  const weeks = [];
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  let cur = new Date(firstDay);
  cur.setDate(cur.getDate() - cur.getDay()); // 해당 주 일요일

  while (cur <= lastDay) {
    const start = new Date(cur);
    const end = new Date(cur); end.setDate(end.getDate() + 6);
    const label = `${month+1}/${start.getDate()}~${end.getMonth()===month ? end.getDate() : lastDay.getDate()}`;
    const startStr = `${year}/${String(start.getMonth()+1).padStart(2,'0')}/${String(start.getDate()).padStart(2,'0')}`;
    const endStr = `${year}/${String(end.getMonth()+1).padStart(2,'0')}/${String(Math.min(end.getDate(), lastDay.getDate())).padStart(2,'0')}`;
    weeks.push({ label, start: startStr, end: endStr });
    cur.setDate(cur.getDate() + 7);
  }
  return weeks.slice(-5);
}

function renderWeeks() {
  const wl = document.getElementById('week-list');
  wl.innerHTML = '';
  const weeks = getWeeksOfMonth(STATE.year, STATE.month);
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  weeks.forEach((w, i) => {
    const el = document.createElement('div');
    el.className = 'week-item' + (STATE.selectedWeek === i ? ' active' : '');
    el.innerHTML = `<div class="week-dot"></div>${months[STATE.month]} ${i+1}주 (${w.label})`;
    el.onclick = () => { STATE.selectedWeek = i; STATE.selectedDate = null; renderCalendar(); renderWeeks(); loadNews(w.start, w.end); };
    wl.appendChild(el);
  });
}

/* ═══════════════════════════════════════
   WATCHLIST SIDEBAR
═══════════════════════════════════════ */
function renderWatchlistSidebar() {
  const el = document.getElementById('watchlist-sidebar');
  if (STATE.watchlist.length === 0) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:4px 7px;">아직 추가된 종목이 없습니다.</div>';
    return;
  }
  el.innerHTML = STATE.watchlist.map(code => {
    const d = STOCK_DETAIL_DB[code];
    const stock = getStock(code);
    if (!stock) return '';
    const chgClass = d ? (d.chg >= 0 ? 'up' : 'dn') : '';
    const chgText = d ? (d.chg >= 0 ? `▲${d.chg}%` : `▼${Math.abs(d.chg)}%`) : '-';
    return `
      <div class="watch-item">
        <button class="watch-open" onclick="showStockDetail('${code}')" aria-label="${stock.name} 상세 보기">
          <span>
            <span class="watch-item-name">${stock.name}</span>
            <span class="watch-item-code">${code}</span>
          </span>
          <span class="watch-item-chg ${chgClass}">${chgText}</span>
        </button>
        <button class="watch-remove" title="${stock.name} 삭제" aria-label="관심종목에서 ${stock.name} 삭제" onclick="removeWatch('${code}', event)">✕</button>
      </div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   NEWS
═══════════════════════════════════════ */
async function loadNews(startDate, endDate) {
  // 로딩 표시
  document.getElementById('news-list').innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--text3);font-size:12px;">뉴스 불러오는 중...</div>';

  let news = [];

  if (startDate && endDate) {
    /* 주간 범위: 해당 기간의 모든 날짜 파일 병합 */
    const dates = getDatesInRange(startDate, endDate);
    const results = await Promise.all(dates.map(d => fetchNewsForDate(d)));
    news = results.flat();
  } else {
    /* 특정 날짜 */
    const dateStr = STATE.selectedDate;
    news = await fetchNewsForDate(dateStr);
  }

  /* 시장 필터 */
  if (STATE.filter === 'kr')    news = news.filter(n => n.market === 'kr');
  else if (STATE.filter === 'us') news = news.filter(n => n.market === 'us');
  else if (STATE.filter === 'watch') {
    news = news.filter(n => n.stocks && n.stocks.some(s => STATE.watchlist.includes(s.code)));
  }

  /* 시간순 정렬 */
  news.sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));

  STATE.allNews = news;
  renderNewsList(news);

  /* header */
  const dateLabel = startDate
    ? `${startDate.replace(/\//g, '.')} ~ ${endDate.replace(/\//g, '.')}`
    : STATE.selectedDate
      ? (() => {
          const [y,m,d] = STATE.selectedDate.split('/');
          return `${y}년 ${m}월 ${d}일`;
        })()
      : '오늘';
  document.getElementById('main-title').textContent = `${dateLabel} 뉴스`;
  document.getElementById('main-sub').textContent = `${news.length}건`;
}

function getDatesInRange(startStr, endStr) {
  const dates = [];
  const [sy, sm, sd] = startStr.split('/').map(Number);
  const [ey, em, ed] = endStr.split('/').map(Number);
  let cur = new Date(sy, sm - 1, sd);
  const end = new Date(ey, em - 1, ed);
  while (cur <= end) {
    const y = cur.getFullYear();
    const m = String(cur.getMonth() + 1).padStart(2, '0');
    const d = String(cur.getDate()).padStart(2, '0');
    dates.push(`${y}/${m}/${d}`);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function renderNewsList(news) {
  const el = document.getElementById('news-list');
  if (news.length === 0) {
    el.innerHTML = `<div class="empty-state" style="min-height:300px;">
      <div class="es-icon">📭</div>
      <div class="es-title">뉴스가 없습니다</div>
      <div class="es-sub">다른 날짜를 선택하거나 필터를 변경해보세요.</div>
    </div>`;
    return;
  }
  el.innerHTML = news.map(n => {
    const isStarred = STATE.watchlist.some(c => n.stocks.some(s => s.code === c));
    n.stocks = (n.stocks || []).map(normalizeStock);
    const stockChips = n.stocks.map(s => {
      const chgText = s.chg >= 0 ? `▲${s.chg}%` : `▼${Math.abs(s.chg)}%`;
      const chgClass = s.chg >= 0 ? 'up' : 'dn';
      return `<span class="stock-chip" onclick="event.stopPropagation();showStockDetail('${s.code}')">${s.name} <span class="chg ${chgClass}">${chgText}</span></span>`;
    }).join('');
    const starred = STATE.watchlist.some(c => n.stocks.some(s => s.code === c));
    return `
      <div class="news-card" id="nc-${n.id}" onclick="selectNewsCard(${n.id})">
        <div class="nc-meta">
          <span class="nc-source">${n.source}</span>
          <span class="nc-badge badge-${n.market}">${n.market === 'kr' ? '국내' : '해외'}</span>
          <span class="nc-time">${n.time}</span>
          <button class="star-btn ${starred ? 'starred' : ''}" title="관심종목에 추가" onclick="event.stopPropagation();">★</button>
        </div>
        <div class="nc-title">${n.title}</div>
        <div class="nc-summary">${n.summary}</div>
        <div class="nc-stocks">
          <span class="nc-stocks-label">관련종목</span>
          ${stockChips}
        </div>
      </div>`;
  }).join('');
}

function selectNewsCard(id) {
  document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
  const el = document.getElementById(`nc-${id}`);
  if (el) el.classList.add('active');
  const news = STATE.allNews.find(n => n.id === id);
  if (news && news.stocks.length > 0) showStockDetail(news.stocks[0].code);
}

function setFilter(f, btn) {
  STATE.filter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadNews();
}

/* ═══════════════════════════════════════
   STOCK DETAIL
═══════════════════════════════════════ */
function showStockDetail(code) {
  code = normalizeCode(code);
  STATE.activeStock = code;
  const d = STOCK_DETAIL_DB[code];
  const stock = getStock(code) || { name: d?.name || code, code, market: d?.market || '' };

  document.getElementById('detail-placeholder').style.display = 'none';
  document.getElementById('detail').classList.add('mobile-open');
  const dc = document.getElementById('detail-content');
  dc.style.display = 'flex';
  const isKr = d?.currency === 'KRW' || ['KOSPI','KOSDAQ','KR','INDEX'].includes(stock.market);
  const currency = stock.market === 'INDEX' ? '' : (isKr ? '원' : '$');

  const price = d ? (isKr ? d.price.toLocaleString() : d.price.toFixed(2)) : '-';
  const chgText = d ? (d.chg >= 0 ? `▲ ${Math.abs(d.chg)}%` : `▼ ${Math.abs(d.chg)}%`) : '';
  const chgClass = d ? (d.chg >= 0 ? 'up' : 'dn') : '';
  const starred = STATE.watchlist.includes(code);
  const initials = stock.name.slice(0,2);

  const relNews = STATE.allNews.filter(n => n.stocks && n.stocks.some(s => s.code === code)).slice(0,3);

  dc.innerHTML = `
    <button class="mobile-detail-close" onclick="closeStockDetail()" aria-label="종목 상세 닫기">← 뉴스 목록으로</button>
    <div class="dp-header">
      <div class="dp-company">
        <div class="dp-icon">${initials}</div>
        <div>
          <div class="dp-name">${stock.name}</div>
          <div class="dp-code">${code} · ${stock.market}</div>
        </div>
      </div>
      <div class="dp-price">${price}<span>${currency}</span></div>
      ${d ? `<div class="dp-chg ${chgClass}">${chgText} 전일 대비</div>` : ''}
      <div style="font-size:9px;color:var(--text3);margin-top:4px;">
        ${d && STATE.marketUpdatedAt ? `무료 지연 시세 · ${new Date(STATE.marketUpdatedAt).toLocaleString('ko-KR')} 갱신 · Yahoo Finance` : '시세를 불러올 수 없습니다.'}
      </div>
      <button class="dp-watch-btn ${starred ? 'starred' : ''}" id="dp-watch-btn" onclick="toggleWatch('${code}')">
        ${starred ? '★ 관심종목 등록됨' : '☆ 관심종목 추가'}
      </button>
    </div>

    <div class="chart-tabs">
      <button class="ctab active" onclick="switchChart(this,'daily','${code}')">일봉</button>
      <button class="ctab" onclick="switchChart(this,'weekly','${code}')">주봉</button>
      <button class="ctab" onclick="switchChart(this,'monthly','${code}')">월봉</button>
    </div>
    <div class="chart-wrap" id="stock-chart"></div>

    ${relNews.length > 0 ? `
    <div class="rel-news" style="margin-top:10px;">
      <div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;">관련 뉴스</div>
      ${relNews.map(n => `
        <div class="rel-news-item" onclick="selectNewsCard(${n.id})">
          <div class="rel-news-title">${n.title}</div>
          <div class="rel-news-date">${n.date.replace(/\//g,'.')}</div>
        </div>`).join('')}
    </div>` : ''}
  `;

  /* Draw chart */
  requestAnimationFrame(() => drawChart('daily', code));
}

function closeStockDetail() {
  document.getElementById('detail').classList.remove('mobile-open');
}

function switchChart(btn, type, code) {
  document.querySelectorAll('.ctab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawChart(type, code);
}

function drawChart(type, code) {
  const d = STOCK_DETAIL_DB[code];
  const chart = document.getElementById('stock-chart');
  if (!chart) return;
  const points = d?.chart?.[type] || [];
  if (!d || !points.length) {
    const stock = getStock(code);
    const cleanCode = code.startsWith('A') && code.length === 7 ? code.slice(1) : code;
    const isKoreanStock = ['KOSPI', 'KOSDAQ'].includes(stock?.market) && /^[0-9A-Z]{6}$/.test(cleanCode);
    if (isKoreanStock) {
      const period = { daily: 'day', weekly: 'week', monthly: 'month' }[type];
      const label = type === 'daily' ? '일봉' : type === 'weekly' ? '주봉' : '월봉';
      chart.classList.add('external');
      chart.innerHTML = `<img src="https://ssl.pstatic.net/imgfinance/chart/item/candle/${period}/${encodeURIComponent(cleanCode)}.png" alt="${stock.name} ${label} 차트" referrerpolicy="no-referrer">`;
      return;
    }
    const exchange = stock?.market === 'KOSDAQ' ? 'KOSDAQ' : stock?.market === 'KOSPI' ? 'KRX' : '';
    const symbol = exchange ? `${exchange}:${cleanCode}` : cleanCode;
    const interval = { daily: 'D', weekly: 'W', monthly: 'M' }[type];
    const params = new URLSearchParams({
      symbol, interval, theme: 'dark', style: '2', locale: 'kr',
      hide_top_toolbar: '1', hide_legend: '1', saveimage: '0'
    });
    chart.classList.add('external');
    chart.innerHTML = `<iframe title="${stock?.name || code} ${type === 'daily' ? '일봉' : type === 'weekly' ? '주봉' : '월봉'} 차트" src="https://s.tradingview.com/widgetembed/?${params}" loading="lazy" referrerpolicy="origin"></iframe>`;
    return;
  }
  chart.classList.remove('external');
  const prices = points.map(point => Number(point.close)).filter(Number.isFinite);
  const width = 280, height = 90, pad = 8;
  const min = Math.min(...prices), max = Math.max(...prices);
  const span = Math.max(max - min, 1);
  const coords = prices.map((price, i) => ({
    x: pad + (i / Math.max(prices.length - 1, 1)) * (width - pad * 2),
    y: pad + ((max - price) / span) * (height - pad * 2)
  }));
  const line = coords.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `${line} L${coords.at(-1).x.toFixed(1)},${height-pad} L${coords[0].x.toFixed(1)},${height-pad} Z`;
  const up = prices.at(-1) >= prices[0];
  const color = up ? '#22c55e' : '#ef4444';
  const fmt = value => value.toLocaleString('ko-KR', {maximumFractionDigits: 2});
  chart.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${type === 'daily' ? '일봉' : type === 'weekly' ? '주봉' : '월봉'} 종가 차트, 최저 ${fmt(min)}, 최고 ${fmt(max)}">
      <defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".2"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#chart-fill)"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
      <circle cx="${coords.at(-1).x}" cy="${coords.at(-1).y}" r="2.5" fill="${color}"/>
      <title>${points[0].date} ~ ${points.at(-1).date}: ${fmt(prices[0])} → ${fmt(prices.at(-1))}</title>
    </svg>`;
}

/* ═══════════════════════════════════════
   WATCHLIST
═══════════════════════════════════════ */
function toggleWatch(code) {
  const idx = STATE.watchlist.indexOf(code);
  if (idx === -1) STATE.watchlist.push(code);
  else STATE.watchlist.splice(idx, 1);
  localStorage.setItem('watchlist', JSON.stringify(STATE.watchlist));
  renderWatchlistSidebar();
  if (STATE.activeStock === code) showStockDetail(code);
}

function removeWatch(code, event) {
  event?.stopPropagation();
  const idx = STATE.watchlist.indexOf(code);
  if (idx !== -1) STATE.watchlist.splice(idx, 1);
  localStorage.setItem('watchlist', JSON.stringify(STATE.watchlist));
  renderWatchlistSidebar();
  if (STATE.activeStock === code) showStockDetail(code);
}

function openWatchlistModal() {
  document.getElementById('watchlist-modal').classList.add('open');
  document.getElementById('modal-search-input').value = '';
  renderModalResults('');
  requestAnimationFrame(() => document.getElementById('modal-search-input').focus());
}

function closeWatchlistModal() {
  document.getElementById('watchlist-modal').classList.remove('open');
}

function searchStocks(q) {
  document.getElementById('search-clear').classList.toggle('visible', q.length > 0);
  renderModalResults(q);
}

function clearStockSearch() {
  const input = document.getElementById('modal-search-input');
  input.value = '';
  searchStocks('');
  input.focus();
}

function renderModalResults(q) {
  const query = q.trim().toLowerCase();
  const matched = query === ''
    ? FALLBACK_STOCKS.slice(0, 12)
    : STOCK_SEARCH_DB.filter(s =>
        s.name.toLowerCase().includes(q.toLowerCase()) ||
        s.code.toLowerCase().includes(q.toLowerCase())
      );
  const results = matched.slice(0, 100);
  document.getElementById('search-status').textContent = query
    ? `${matched.length.toLocaleString()}개 종목 검색됨${matched.length > 100 ? ' · 상위 100개 표시' : ''}`
    : `코스피·코스닥 ${STOCK_SEARCH_DB.filter(s => s.market === 'KOSPI' || s.market === 'KOSDAQ').length.toLocaleString()}개 종목에서 검색`;

  const el = document.getElementById('modal-results');
  if (results.length === 0) {
    el.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:var(--text3);">검색 결과가 없습니다</div>';
    return;
  }
  el.innerHTML = results.map(s => {
    const added = STATE.watchlist.includes(s.code);
    return `
      <div class="search-result-item">
        <div class="sri-info">
          <div class="sri-name">${s.name}</div>
          <div class="sri-code">${s.code} · ${s.market}</div>
        </div>
        <button class="add-btn ${added ? 'added' : ''}" onclick="addFromModal('${s.code}')" ${added ? 'disabled' : ''}>
          ${added ? '추가됨' : '+ 추가'}
        </button>
      </div>`;
  }).join('');
}

function addFromModal(code) {
  if (!STATE.watchlist.includes(code)) {
    STATE.watchlist.push(code);
    localStorage.setItem('watchlist', JSON.stringify(STATE.watchlist));
    renderWatchlistSidebar();
    renderModalResults(document.getElementById('modal-search-input').value);
  }
}

/* Close modal on backdrop click */
document.getElementById('watchlist-modal').addEventListener('click', function(e) {
  if (e.target === this) closeWatchlistModal();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && document.getElementById('watchlist-modal').classList.contains('open')) closeWatchlistModal();
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
async function init() {
  const today = new Date();
  STATE.year  = today.getFullYear();
  STATE.month = today.getMonth();
  STATE.selectedDate = `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;

  // 뉴스 인덱스와 실제 시세를 함께 로드한다.
  await Promise.all([fetchNewsIndex(), fetchMarketData(), fetchStockUniverse()]);

  renderCalendar();
  renderWeeks();
  renderWatchlistSidebar();
  await loadNews();
}

init();
</script>
